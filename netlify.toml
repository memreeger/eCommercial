[build]
  # Build komutu
  command = "npm run build"
  
  # Vite build çıktı dizini
  publish = "dist"

# SPA yönlendirmesi - React Router için gerekli
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache ayarları - performans optimizasyonu
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers (opsiyonel ama önerilen)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"